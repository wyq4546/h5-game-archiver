 //加载js 完成后有回调
 function loadScriptAndCallBack(moduleName, cb) {
   function scriptLoaded() {
   document.body.removeChild(domScript);
   domScript.removeEventListener('load', scriptLoaded, false);
   cb && cb();
   };
   var domScript = document.createElement('script');
   domScript.async = true;
   domScript.src = moduleName;
   domScript.addEventListener('load', scriptLoaded, false);
   document.body.appendChild(domScript);
 }
 
 function loadLib(url) {
   var script = document.createElement("script");
   script.async = false;
   script.src = url;
   document.body.appendChild(script);
 }
 </script>
<script type="text/javascript">
 //关闭日志
 console.log = console.info = console.warn = function () { };
 
 let onLoadComplete = function () {
  
 
   VkApp.BG_COLOR = "BLUE";
 
   //注意！！！！ 每个游戏都需要改掉，比如存储时不容易交叉
   VkApp.GAME_NAME = "Jl-Beauty-Fight-";   

    //注意！！！！ 每个游戏都需要改掉，比如存储时不容易交叉
	  // VkApp.GAME_NAME = "Jl-Beautiful-Angel-";   

	    //yd 使用外部代码替换掉游戏内的声音接口
		VkApp.initMusic = async function () {
        
        //自行修改 游戏名称
        CoinAppAudio.music_state_key = "isSoundMute";
        //自行修改 背景音乐
        CoinAppAudio.bgm = "res/sounds/bgmggx.mp3";

        //进入游戏，先判断是否静音
        VkApp.isSoundMute = CoinAppAudio.isMuted = await VkApp.getItem(CoinAppAudio.music_state_key) ?
          JSON.parse(await VkApp.getItem(CoinAppAudio.music_state_key)) : false;

        console.log("Sy --- CoinAppAudio.isMuted= " + CoinAppAudio.isMuted);
        //声音初始化 进入游戏
        CoinAppAudio.onStart();
        // CoinAppAudio.playMusic(CoinAppAudio.bgm);

        //音效有问题在处理
        //游戏内播放音效的地方，接口改掉，举例如下
        // CoinAppAudio.playSound("click.mp3");
      }
 
   //注意！！！！ 配置该游戏的appid
   VkApp.GAME_APPID = "51493082";
 
   window.res_scheme = '';
   //判断是否是苹果环境
   window.isOdr = location.href.indexOf('odr_enabled=1') != -1;
   if (window.isOdr) {
   //远程资源地址要根据新的游戏替换
   window["RES_CDN_URL"] = "vkcors://xz.fzhdnet.com/vk_new_game/jl_game/jl_beauty_fight/prod/";
   }
   console.log("Sy --- 初始加载");
   VkApp.addLoadingCircle();
   //Taylor 通知vk加载好了
      //yd 是否开启音乐
      window.isOpenMusic = true;
    //yd 是否在看视频 插屏
    window.isVideo = false;
   VkApp.initVk().then(() => {
    switch (VkApp.GAME_LANGUAGE) {
          case "en":
              VkApp.GAME_LANGUAGE = "en";
              break;
          case "ru":
              VkApp.GAME_LANGUAGE = "ru";
              break;
          case "tr":
              VkApp.GAME_LANGUAGE = "tr";
              break;
          case "de":
              VkApp.GAME_LANGUAGE = "de";
              break;
          case "ja":
              VkApp.GAME_LANGUAGE = "ja";
              break;
          case "es":
              VkApp.GAME_LANGUAGE = "es";
              break;
          case "ar":
              VkApp.GAME_LANGUAGE = "ar";
              break;
          default:
              VkApp.GAME_LANGUAGE = "en";
              break;
      }
      //yd 初始化声音系统
      VkApp.initMusic();
      CoinAppAudio.bgm = "ru/res/sounds/bgmggx.mp3";
   loadLib("./index.js?v=" + Math.random());
