<script>
      function activityRTB1(state, isDesktop)
      {
        Rtb_banner = document.getElementById("RTB_Banner");
        Rtb_left = document.getElementById("RTB_Left");
        Rtb_right = document.getElementById("RTB_Right");
        if(Rtb_banner && !isDesktop){
          activityRTB_Banner(state);
        }
        if(Rtb_left && isDesktop){
          activityRTB_Left(state);
        }
        if(Rtb_right && isDesktop){
          activityRTB_Right(state);
        }
      }
      function renderRTB1(isDesktop){
        Rtb_banner = document.getElementById("RTB_Banner");
        Rtb_left = document.getElementById("RTB_Left");
        Rtb_right = document.getElementById("RTB_Right");
        if(Rtb_banner && !isDesktop){
          renderRTB_Banner();
        }
        if(Rtb_left && isDesktop){
          renderRTB_Left();
        }
        if(Rtb_right && isDesktop){
          renderRTB_Right();
        }
      }
    </script>
<div id="unity-fullscreen-button" style="display: none;"></div>
<script>
      const buildUrl = "Build";
      const loaderUrl = buildUrl + "/WebGL.loader.js";
      const config = {
        dataUrl: buildUrl + "/WebGL.data.unityweb",
        frameworkUrl: buildUrl + "/WebGL.framework.js.unityweb",
        codeUrl: buildUrl + "/WebGL.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "YouIndieGame",
        productName: "Get Healthy",
        productVersion: "1.0.0",

        cacheControl: function(url){
          var openRequest = indexedDB.open("UnityCache");
          openRequest.onerror = function(){
            console.warn("indexedDB not available. Re-downloading all data");
            return "no-store";
          }

          openRequest.onsuccess = function(){
            console.log("indexedDB available. Used default cache control");
            openRequest.result.close();
            if (url.match(/\.data/) || url.match(/\.bundle/) || url.match(/\.wasm/)) {
              return "must-revalidate";
            }
            return "no-store";
          }
        },
        
      };

      const container = document.querySelector("#unity-container");
      const canvas = document.querySelector("#unity-canvas");
      const loadingCover = document.querySelector("#loading-cover");
      const progressBarEmpty = document.querySelector("#unity-progress-bar-empty");
      const progressBarFull = document.querySelector("#unity-progress-bar-full");
      const fullscreenButton = document.querySelector("#unity-fullscreen-button");
      const spinner = document.querySelector('.spinner');

      canvas.addEventListener("touchstart", () => {window.focus()});
      canvas.addEventListener("pointerdown", () => {window.focus()});

      const canFullscreen = (function() {
        for (const key of [
            'exitFullscreen',
            'webkitExitFullscreen',
            'webkitCancelFullScreen',
            'mozCancelFullScreen',
            'msExitFullscreen',
          ]) {
          if (key in document) {
            return true;
          }
        }
        return false;
      }());
      
      var onResize;

      function LimitMaxDevicePixelRatio(config, maxDevicePixelRatio)
      {
          if (isNaN(parseFloat(config.devicePixelRatio))) {
              config.devicePixelRatio = maxDevicePixelRatio;
          }
          else {
              console.log('Default device pixel ratio is: ' + config.devicePixelRatio)
              config.devicePixelRatio = Math.min(config.devicePixelRatio, maxDevicePixelRatio);
              console.log('Set device pixel ratio to: ' + config.devicePixelRatio)
          }
      }

      if (/iPad|Android/i.test(navigator.userAgent)) {
          container.className = "unity-mobile";

          // Uncomment these lines to use lowered screen resolution on iPad/Android.
          // Change maxDevicePixelRatio value to change resolution scaling.

          // const maxDevicePixelRatio = 1.5;
          // LimitMaxDevicePixelRatio(config, maxDevicePixelRatio);
      }
      else if (/iPhone|iPod/i.test(navigator.userAgent)) {
          container.className = "unity-mobile";

          // Comment these lines to use original screen resolution on iPhone/iPod.
          // Change maxDevicePixelRatio value to change resolution scaling.
          // It highly affects memory usage for iOS.

          const maxDevicePixelRatio = 1.5;
          LimitMaxDevicePixelRatio(config, maxDevicePixelRatio);
      }
      
      loadingCover.style.display = "";

      const script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          spinner.style.display = "none";
          progressBarEmpty.style.display = "";
          progressBarFull.style.width = `${100 * progress}%`;
        }).then((unityInstance) => {
          loadingCover.style.display = "none";
        }).catch((message) => {
          alert(message);
        });
      };
      document.body.appendChild(script);
    </script>
